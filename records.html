<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Click Fast! - Records</title>

    <link rel="stylesheet" href="css/records.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>

        <div class="logo">
            <div class="logo-icon">⚡</div>

            <div class="logo-text">
                CLICK <span>FAST!</span>
            </div>
        </div>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="jeux.html">Jeu</a>
            <a href="records.html" class="active">Records</a>
        </nav>

    </header>


    <main>

        <h1>
            MES <span class="highlight">RECORDS</span>
        </h1>

        <p class="subtitle">
            Découvrez vos meilleurs scores
        </p>


        <div class="records">

            <div class="record-card">
                <div class="level">LEVEL 1</div>

                <div class="icon">⚡</div>

                <h2>Score</h2>

                <p id="scoreLevel1">0</p>

                <span>4 × 4</span>
            </div>


            <div class="record-card">
                <div class="level">LEVEL 2</div>

                <div class="icon">⚡</div>

                <h2>Score</h2>

                <p id="scoreLevel2">0</p>

                <span>6 × 6</span>
            </div>


            <div class="record-card">
                <div class="level">LEVEL 3</div>

                <div class="icon">⚡</div>

                <h2>Score</h2>

                <p id="scoreLevel3">0</p>

                <span>8 × 8</span>
            </div>

        </div>

    </main>


    <footer>

        <p>
            Click Fast! <i>⚡</i> Testez vos réflexes
        </p>

    </footer>


    <script src="records.js"></script>

</body>

</html>
