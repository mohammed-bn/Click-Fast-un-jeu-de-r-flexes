<body>
    <header>
        <div class="logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">CLICK <span>FAST!</span></span>
        </div>
        <nav>
            <a href="#" class="active">Accueil</a>
            <a href="jeux.html">Jouer</a>
            <a href="#">Records</a>
            <a href="#">Historique</a>
        </nav>
    </header>

    <!-- ============================================
    MAIN - CONTENU PRINCIPAL
    ============================================ -->
    <main>
        <h1>Teste tes <span class="highlight">réflexes</span></h1>
        <p class="subtitle">Clique sur la cible le plus vite possible et bats ton record !</p>

        <!-- BOUTON START -->
        <button class="btn-start" id="startBtn">
            <i class="fas fa-play"></i> Démarrer
        </button>

        <p class="hint">⚡ Prêt à relever le défi ?</p>
    </main>

    <!-- ============================================
    FOOTER
    ============================================ -->
    <footer>
        <p>
            <i class="fas fa-bolt"></i>
            Click Fast! - Le jeu de réflexes ultime
            <i class="fas fa-heart heart"></i>
        </p>
    </footer>
