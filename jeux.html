<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim & Reaction Trainer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/jeux.css">
</head>

<body>

    <div class="game-container">
        <header class="game-header">
            <h1>Aim Trainer</h1>
            <div class="timer-box">
                Time: <span id="timer">10</span>s
            </div>
        </header>

        <div class="btns" id="board"></div>

        <button id="startGame" class="btn-primary">Start The Game</button>

        <div id="resultCard" class="result-card">
            <h2>Résultat</h2>

            <p>Score : <span id="resultScore">0</span></p>
            <p>Bonnes réponses : <span id="resultCorrect">0</span></p>
            <p>Mauvais clics : <span id="resultMiss">0</span></p>
            <p>Total des clics : <span id="resultAttempts">0</span></p>

            <button id="next">Next Level</button>
        </div>


        <script src="/ScriptJs/main.js"></script>
</body>

</html>
