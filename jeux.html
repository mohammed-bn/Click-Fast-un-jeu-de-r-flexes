<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim & Reaction Trainer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/jeux.css">
</head>
<body>

    <div class="game-container">
        <header class="game-header">
            <h1>Aim Trainer</h1>
            <div class="timer-box">
                Time: <span id="timer">10</span>s
            </div>
        </header>

        <div class="btns" id="board"></div>

        <button id="startGame" class="btn-primary">Start The Game</button>

        <div class="results-card">
            <h3>Result Summary</h3>
            <div class="stats-grid">
                <p id="totalAttemps">Total attempts: 0</p>
                <p id="correctClick">Correct clicks: 0</p>
                <p id="missClick">Miss clicks: 0</p>
                <p id="ignoreClick">Miss clicks: 0</p>
            </div>
        </div>

        <button class="btn-start" id="next">
            <i class="fas fa-play"></i> Next >>>   
        </button>

    </div>


    <script src="/ScriptJs/main.js"></script>
</body>
</html>
